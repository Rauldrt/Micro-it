<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro de alta tecnología -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Resplandor Aurora Boreal para el favicon -->
    <filter id="auroraFavicon" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>

    <!-- Bisel suave perimetral -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Destello superior sutil -->
    <linearGradient id="topGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Contenedor Badge con esquinas redondeadas -->
  <rect x="3" y="3" width="94" height="94" rx="26" ry="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="4" y="4" width="92" height="46" rx="24" ry="24" fill="url(#topGleam)" pointer-events="none" />

  <!-- Glifo µ Oficial de Micro-it: Calibre Extra Bold, Flat-Cut, Negro puro (#000000) con aura polar -->
  <path 
    d="M 17.5,12.0 L 35.5,12.0 L 35.5,46.0 C 35.5,53.5 39.5,58.0 46.5,58.0 C 53.5,58.0 57.5,53.5 57.5,46.0 L 57.5,12.0 L 75.5,12.0 L 75.5,51.0 C 75.5,56.5 78.5,59.5 84.5,60.5 L 84.5,72.5 C 74.0,72.5 64.5,66.0 61.0,58.0 C 56.0,66.0 47.5,70.5 39.5,70.5 C 36.0,70.5 35.5,68.0 35.5,64.0 L 35.5,88.0 L 17.5,88.0 Z" 
    fill="#000000" 
    filter="url(#auroraFavicon)"
  />
</svg>
