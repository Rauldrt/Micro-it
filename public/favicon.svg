<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -12 128 124" width="100%" height="100%">
  <defs>
    <!-- Filtro de Resplandor Neón Aurora Difuminado (Fallback estático universal de alto contraste) -->
    <filter id="neonAurora" x="-60%" y="-60%" width="220%" height="220%">
      <!-- Capa 1: Sombra neón difuminada amplia (Aurora Polar Cian / Esmeralda) -->
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#06b6d4" flood-opacity="0.95" />
      <!-- Capa 2: Resplandor medio de alta energía eléctrico -->
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#38bdf8" flood-opacity="1" />
      <!-- Capa 3: Luz de contorno inmediata de gran nitidez -->
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#10b981" flood-opacity="1" />
    </filter>

    <style>
      @keyframes aurora-neon-tab {
        0%, 100% {
          filter: 
            drop-shadow(0 0 2px #10b981)
            drop-shadow(0 0 5px #06b6d4)
            drop-shadow(0 0 10px #38bdf8);
        }
        33% {
          filter: 
            drop-shadow(0 0 2px #06b6d4)
            drop-shadow(0 0 5px #38bdf8)
            drop-shadow(0 0 10px #a855f7);
        }
        66% {
          filter: 
            drop-shadow(0 0 2px #38bdf8)
            drop-shadow(0 0 5px #a855f7)
            drop-shadow(0 0 10px #10b981);
        }
      }
      .neon-glyph {
        animation: aurora-neon-tab 9.5s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Fondo 100% TRANSPARENTE: Sin marcos rectangulares ni fondos sólidos opacos -->

  <!-- Glifo µ Oficial Micro-it: Negro puro (#000000) con borde blanco nítido (#ffffff) y sombra neón difuminada -->
  <path 
    class="neon-glyph"
    d="M 17.5,12.0 L 35.5,12.0 L 35.5,46.0 C 35.5,53.5 39.5,58.0 46.5,58.0 C 53.5,58.0 57.5,53.5 57.5,46.0 L 57.5,12.0 L 75.5,12.0 L 75.5,51.0 C 75.5,56.5 78.5,59.5 84.5,60.5 L 84.5,72.5 C 74.0,72.5 64.5,66.0 61.0,58.0 C 56.0,66.0 47.5,70.5 39.5,70.5 C 36.0,70.5 35.5,68.0 35.5,64.0 L 35.5,88.0 L 17.5,88.0 Z" 
    fill="#000000" 
    stroke="#ffffff"
    stroke-width="3"
    stroke-linejoin="miter"
    filter="url(#neonAurora)"
  />
</svg>
